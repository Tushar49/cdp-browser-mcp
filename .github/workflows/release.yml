name: Release

# Tagged releases only, from main only. Builds dist/, publishes a GitHub
# Release with the bundle, and publishes to npm when the NPM_TOKEN secret
# is set (skipped otherwise). Dev branch can never cut a release.
#
# npm dist-tag: prerelease tags (vX.Y.Z-foo) publish under "alpha",
# stable tags publish under "latest".
#
# Usage:
#   1. Promote dev → main (promote.yml, gives main the release version).
#   2. Tag main:  git tag vX.Y.Z && git push origin vX.Y.Z
#   3. This workflow builds, attaches the bundle, publishes the GitHub
#      Release and (when NPM_TOKEN is configured) npm.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Refuse release if tag is not on main
        run: |
          git fetch origin main --depth=50
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "❌ Tag $GITHUB_REF_NAME is not on main. Releases ship from main only."
            exit 1
          fi
          echo "✅ Tag $GITHUB_REF_NAME is on main."

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'MCP Server/pnpm-lock.yaml'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: MCP Server
        run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
        working-directory: MCP Server

      - run: pnpm run build
        working-directory: MCP Server

      - name: Determine npm dist-tag
        id: disttag
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for npm credentials
        id: npmcheck
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret not set — skipping npm publish, GitHub Release only"
          fi

      - name: Publish to npm
        if: steps.npmcheck.outputs.publish == 'true'
        working-directory: MCP Server
        run: pnpm publish --no-git-checks --tag ${{ steps.disttag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package release bundle
        run: |
          cd "MCP Server"
          tar -czf ../cdp-browser-mcp-dist-${{ github.ref_name }}.tar.gz dist/ package.json pnpm-lock.yaml README.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cdp-browser-mcp-dist-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
