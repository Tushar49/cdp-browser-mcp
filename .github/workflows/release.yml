name: Release

# Tagged releases only, from main only. Builds dist/, publishes a GitHub
# Release with the bundle, and publishes to npm via Trusted Publishing
# (tokenless OIDC — requires the package's Trusted Publisher on npmjs.com
# to point at this repo + release.yml). Dev branch can never cut a release.
#
# npm dist-tag: prerelease tags (vX.Y.Z-foo) publish under "alpha",
# stable tags publish under "latest".
#
# Usage:
#   1. Promote dev → main (promote.yml, gives main the release version).
#   2. Tag main:  git tag vX.Y.Z && git push origin vX.Y.Z
#   3. This workflow builds, attaches the bundle, publishes the GitHub
#      Release and npm (no token needed — OIDC via GitHub).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Refuse release if tag is not on main
        run: |
          git fetch origin main --depth=50
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "❌ Tag $GITHUB_REF_NAME is not on main. Releases ship from main only."
            exit 1
          fi
          echo "✅ Tag $GITHUB_REF_NAME is on main."

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: 'MCP Server/package.json'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'MCP Server/pnpm-lock.yaml'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: MCP Server
        run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
        working-directory: MCP Server

      - run: pnpm run build
        working-directory: MCP Server

      - name: Determine npm dist-tag
        id: disttag
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (trusted publishing, tokenless OIDC)
        working-directory: MCP Server
        run: npm publish --provenance --tag ${{ steps.disttag.outputs.tag }}

      - name: Package release bundle
        run: |
          cd "MCP Server"
          tar -czf ../cdp-browser-mcp-dist-${{ github.ref_name }}.tar.gz dist/ package.json pnpm-lock.yaml README.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cdp-browser-mcp-dist-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
